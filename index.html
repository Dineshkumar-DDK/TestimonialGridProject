<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Grid Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">


</head>

<body class="bg-gray-200">
    <!-- ---------Global Container------- -->
    <div class="container mx-auto p-2 md:p-10 max-w-7xl">
        <!-- ---------Grid Container------- -->
        <div class="text-white">
            <!-- ---------Box 1------- -->
            <div class="relative p-10 rounded-xl bg-purple-700">
                <img src="images/bg-pattern-quotation.svg" alt="quotes svg icon"
                    class="absolute top-3 right-10 scale-125 md:top-7 md:right-24 md:scale-150">
                <!-- ---------Box Header------- -->
                <div class="flex z-10 space-x-4">
                    <img src="images/image-daniel.jpg" alt="daniel profile picture" class="h-10 w-10 rounded-full ring-2 ring-purple-300">
                    <div class="text-sm">
                        <h4 class="opacity-90">Daniel Clifford</h4>
                        <p class="opacity-50">Verified Graduate</p>
                    </div>
                </div>
            </div>
        </div>
    </div>



</body>


</html>
